name: Build Apollo Twin X Character

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure DSP core
        run: cmake -S . -B build-core

      - name: Build DSP core tests
        run: cmake --build build-core --parallel 2

      - name: Run DSP tests
        run: ctest --test-dir build-core --output-on-failure

  macos-intel-vst3:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Steinberg VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          path: vst3sdk
          submodules: recursive

      - name: Configure Intel VST3
        run: >-
          cmake -S . -B build-vst3 -G Xcode
          -DBUILD_VST3_ADAPTER=ON
          -DVST3_SDK_DIR="$GITHUB_WORKSPACE/vst3sdk"
          -DCMAKE_OSX_ARCHITECTURES=x86_64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          -DSMTG_CREATE_PLUGIN_LINK=OFF

      - name: Build Intel VST3
        run: cmake --build build-vst3 --config Release --target ApolloTwinXCharacter --parallel 4

      - name: Collect VST3
        shell: bash
        run: |
          VST=$(find build-vst3 -type d -name 'ApolloTwinXCharacter.vst3' -print -quit)
          test -n "$VST"
          test -f "$VST/Contents/MacOS/ApolloTwinXCharacter"
          mkdir -p artifact
          cp -R "$VST" artifact/
          ditto -c -k --sequesterRsrc --keepParent "$VST" artifact/Apollo-Twin-X-Character-macOS-Intel.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Apollo-Twin-X-Character-macOS-Intel
          path: artifact
          retention-days: 30

  windows-vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Steinberg VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          path: vst3sdk
          submodules: recursive

      - name: Configure VST3
        shell: pwsh
        run: cmake -S . -B build-vst3 -A x64 -DBUILD_VST3_ADAPTER=ON "-DVST3_SDK_DIR=$env:GITHUB_WORKSPACE/vst3sdk" -DSMTG_CREATE_PLUGIN_LINK=OFF

      - name: Build VST3
        run: cmake --build build-vst3 --config Release --target ApolloTwinXCharacter --parallel 4

      - name: Collect VST3
        shell: pwsh
        run: |
          $vst = Get-ChildItem build-vst3 -Recurse -Directory -Filter 'ApolloTwinXCharacter.vst3' | Select-Object -First 1
          if (-not $vst) { throw 'VST3 bundle not found' }

          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item $vst.FullName artifact/ -Recurse
          Compress-Archive -Path artifact/ApolloTwinXCharacter.vst3 -DestinationPath artifact/Apollo-Twin-X-Character-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Apollo-Twin-X-Character-Windows-x64
          path: artifact
          retention-days: 30
